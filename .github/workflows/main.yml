name: next-deploy-vps

on:
  push:
    branches: [ production ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Deploy using ssh
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.HOST }}
        username: ${{ secrets.USERNAME }}
        password: ${{ secrets.PASSWORD }}
        port: 22
        script: |
          cd /root/services/pengoo_client
          git fetch origin
          git checkout production
          git pull

          docker stop pengoo_client-container 2>/dev/null || true
          docker rm pengoo_client-container 2>/dev/null || true
          docker rmi pengoo_client 2>/dev/null || true

          docker build -t pengoo_client .

          docker run -d --name pengoo_client-container -p 4000:3000 pengoo_client

          docker image prune -af
          docker container prune -f

          echo "🚀 Deploy completed and cleaned up!"
