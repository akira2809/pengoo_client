name: next-deploy-vps

on:
  push:
    branches: [ production ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Deploy using ssh
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.HOST }}
        username: ${{ secrets.USERNAME }}
        password: ${{ secrets.PASSWORD }}
        port: 22
        script: |
          cd /services/pengoo_client
          git fetch origin
          git checkout production
          git pull 
          docker build -t pengoo_client .
          docker stop pengoo_client-container || true
          docker rm pengoo_client-container || true 

          